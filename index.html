<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小三數學 - 乘數爬山大挑戰</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', 'Noto Sans HK', sans-serif;
            user-select: none;
            overflow-x: hidden;
            background-color: #f0f9ff;
        }

        @keyframes bounce-idle {
            0%, 100% { transform: translateY(0) translateX(-50%); }
            50% { transform: translateY(-8px) translateX(-50%); }
        }
        
        .idle-bounce {
            animation: bounce-idle 2.5s infinite ease-in-out;
        }

        /* 山頂登頂跳躍慶祝動畫 */
        @keyframes victory-jump {
            0%, 100% { transform: translateY(0) translateX(-50%) scale(1); }
            50% { transform: translateY(-18px) translateX(-50%) scale(1.15); }
        }
        
        .victory-animation {
            animation: victory-jump 0.5s infinite ease-in-out !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes cloud-move {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }
        .cloud {
            animation: cloud-move linear infinite;
        }

        .bg-mountain {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col text-slate-800 relative overflow-hidden">

    <!-- 1. 角色創建與模式選擇視窗 (Setup & Mode Select Screen) -->
    <div id="setup-screen" class="fixed inset-0 bg-sky-100 z-50 flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="bg-white rounded-[2.5rem] shadow-2xl p-6 md:p-8 w-full max-w-3xl flex flex-col md:flex-row gap-6 max-h-[92vh] overflow-y-auto">
            
            <!-- 左側角色預覽 -->
            <div class="flex-1 flex flex-col items-center justify-center bg-sky-50 rounded-3xl p-5 border-4 border-sky-200 shadow-inner">
                <h2 class="text-xl md:text-2xl font-black text-sky-800 mb-2 text-center">創建你的專屬登山者 🧗</h2>
                <div id="setup-preview" class="w-32 h-40 md:w-40 md:h-52 transition-transform hover:scale-105 duration-300 drop-shadow-xl"></div>
            </div>
            
            <!-- 右側設定區 -->
            <div class="flex-1 flex flex-col justify-center gap-4">
                <!-- 性別選擇 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-600 mb-1.5">性別：</h3>
                    <div class="flex gap-3">
                        <button onclick="setPlayerOption('gender', 'boy')" id="btn-gender-boy" class="flex-1 py-2 border-4 rounded-xl active:scale-95 transition-all text-sm font-black">男仔 👦</button>
                        <button onclick="setPlayerOption('gender', 'girl')" id="btn-gender-girl" class="flex-1 py-2 border-4 rounded-xl active:scale-95 transition-all text-sm font-black">女仔 👧</button>
                    </div>
                </div>

                <!-- 髮型選擇 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-600 mb-1.5">髮型款式：</h3>
                    <div class="flex gap-3">
                        <button onclick="setPlayerOption('hair', 1)" id="btn-hair-1" class="flex-1 py-2 border-4 rounded-xl active:scale-95 transition-all text-sm font-black">款式一</button>
                        <button onclick="setPlayerOption('hair', 2)" id="btn-hair-2" class="flex-1 py-2 border-4 rounded-xl active:scale-95 transition-all text-sm font-black">款式二</button>
                    </div>
                </div>

                <!-- 顏色選擇 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-600 mb-1.5">服飾顏色：</h3>
                    <div class="flex gap-2.5 justify-start flex-wrap">
                        <button onclick="setPlayerOption('color', '#ef4444')" class="w-8 h-8 rounded-full bg-red-500 hover:scale-110 border-4 border-white shadow-md transition-transform"></button>
                        <button onclick="setPlayerOption('color', '#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 hover:scale-110 border-4 border-white shadow-md transition-transform"></button>
                        <button onclick="setPlayerOption('color', '#22c55e')" class="w-8 h-8 rounded-full bg-green-500 hover:scale-110 border-4 border-white shadow-md transition-transform"></button>
                        <button onclick="setPlayerOption('color', '#f59e0b')" class="w-8 h-8 rounded-full bg-amber-500 hover:scale-110 border-4 border-white shadow-md transition-transform"></button>
                        <button onclick="setPlayerOption('color', '#a855f7')" class="w-8 h-8 rounded-full bg-purple-500 hover:scale-110 border-4 border-white shadow-md transition-transform"></button>
                        <button onclick="setPlayerOption('color', '#ec4899')" class="w-8 h-8 rounded-full bg-pink-500 hover:scale-110 border-4 border-white shadow-md transition-transform"></button>
                    </div>
                </div>

                <hr class="border-slate-200 my-1">

                <!-- 模式與關卡選擇區 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-700 mb-1.5">🎮 選擇挑戰模式：</h3>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <button id="btn-setup-mode-single" onclick="setSetupGameMode('single')" class="py-2 border-4 border-indigo-400 bg-indigo-100 text-indigo-900 font-black rounded-xl text-xs md:text-sm active:scale-95 transition-all">
                            🎯 單關練習
                        </button>
                        <button id="btn-setup-mode-all" onclick="setSetupGameMode('all')" class="py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl text-xs md:text-sm active:scale-95 transition-all">
                            🏆 全關大挑戰 (1-9關)
                        </button>
                    </div>

                    <!-- 單關模式下出現的關卡下拉選單 -->
                    <div id="setup-level-select-container">
                        <select id="setup-level-select" class="w-full bg-indigo-50 border-2 border-indigo-300 text-indigo-900 font-black rounded-xl p-2 text-xs md:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer">
                            <option value="1">第一關：2的乘數 (首對15題)</option>
                            <option value="2">第二關：3的乘數 (首對15題)</option>
                            <option value="3">第三關：4的乘數 (首對15題)</option>
                            <option value="4">第四關：5的乘數 (首對15題)</option>
                            <option value="5">第五關：6的乘數 (首對15題)</option>
                            <option value="6">第六關：7的乘數 (首對15題)</option>
                            <option value="7">第七關：8的乘數 (首對15題)</option>
                            <option value="8">第八關：9的乘數 (首對15題)</option>
                            <option value="9">第九關：2-9綜合大挑戰 (首對20題)</option>
                        </select>
                    </div>
                </div>

                <button onclick="finishSetup()" class="mt-1 w-full py-3 bg-green-500 hover:bg-green-600 text-white font-black rounded-2xl text-lg transition-all active:scale-95 shadow-lg border-b-4 border-green-700">
                    開始爬山挑戰！ 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- 頂部標題與關卡選單區 -->
    <header class="w-full bg-white/90 backdrop-blur border-b-2 border-indigo-100 p-3 flex flex-col items-center justify-center z-30 shadow-sm shrink-0">
        <h1 class="text-2xl md:text-3xl font-black text-indigo-600 tracking-wide flex items-center justify-center gap-2 mb-2">
            <span>✏️</span> 乘數表爬山大挑戰 <span>✖️</span>
        </h1>
        
        <div class="flex flex-wrap items-center justify-center gap-3 w-full max-w-2xl">
            <div class="flex items-center gap-2">
                <label for="level-select" class="font-black text-indigo-900 text-sm md:text-base whitespace-nowrap">🎯 關卡選單：</label>
                <select id="level-select" onchange="userSelectLevel(this.value)" class="bg-indigo-50 border-2 border-indigo-300 text-indigo-900 font-black rounded-xl px-3 py-1.5 text-sm md:text-base focus:outline-none focus:ring-2 focus:ring-indigo-400 cursor-pointer">
                    <option value="1">第一關：2的乘數 (首對15題)</option>
                    <option value="2">第二關：3的乘數 (首對15題)</option>
                    <option value="3">第三關：4的乘數 (首對15題)</option>
                    <option value="4">第四關：5的乘數 (首對15題)</option>
                    <option value="5">第五關：6的乘數 (首對15題)</option>
                    <option value="6">第六關：7的乘數 (首對15題)</option>
                    <option value="7">第七關：8的乘數 (首對15題)</option>
                    <option value="8">第八關：9的乘數 (首對15題)</option>
                    <option value="9">第九關：2-9綜合大挑戰 (首對20題)</option>
                </select>
            </div>

            <button id="btn-all-challenge" onclick="startAllChallenge()" class="px-4 py-1.5 bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-black rounded-xl shadow-md border-b-4 border-amber-600 transition-all text-sm md:text-base flex items-center gap-1">
                <span>🏆</span> 全關挑戰模式 (1-9關)
            </button>
        </div>
    </header>

    <!-- 主遊戲內容區 -->
    <div class="flex-grow flex flex-col md:flex-row overflow-hidden relative">

        <!-- 左側：爬山動畫視圖 -->
        <div class="h-2/5 md:h-full md:w-5/12 relative bg-mountain overflow-hidden border-b-4 md:border-b-0 md:border-r-4 border-slate-300 shadow-xl z-10 flex flex-col shrink-0">
            
            <div class="absolute top-3 left-3 right-3 z-20 flex justify-between items-start pointer-events-none">
                <div class="bg-white/90 backdrop-blur px-3 py-1.5 rounded-2xl shadow-md border-2 border-white pointer-events-auto flex flex-col gap-1">
                    <span class="text-xs font-black text-indigo-600" id="ui-mode-label">單關練習</span>
                    <div class="flex gap-2 text-xs md:text-sm font-black">
                        <span class="text-emerald-600">🌟 首對: <span id="stat-first-correct" class="text-base">0</span>/<span id="stat-target-goal">15</span></span>
                        <span class="text-rose-600">⚠️ 未首對: <span id="stat-not-first" class="text-base">0</span></span>
                    </div>
                </div>

                <div class="bg-white/90 backdrop-blur px-3 py-1.5 rounded-2xl shadow-md border-2 border-white pointer-events-auto text-right">
                    <h2 class="text-xs md:text-sm font-black text-slate-500">登頂進度</h2>
                    <p class="text-base md:text-lg font-black text-amber-500" id="ui-progress-text">0%</p>
                </div>
            </div>

            <div class="absolute top-4 right-1/4 w-10 h-10 md:w-14 md:h-14 bg-amber-400 rounded-full shadow-[0_0_25px_rgba(251,191,36,0.8)] z-0"></div>
            <div class="absolute top-8 left-0 opacity-80 text-3xl cloud z-0" style="animation-duration: 35s;">☁️</div>
            <div class="absolute top-20 left-0 opacity-60 text-4xl cloud z-0" style="animation-duration: 45s; animation-delay: -15s;">☁️</div>

            <!-- 高聳山脈背景與山頂旗幟 -->
            <div class="absolute bottom-0 w-full h-[92%] md:h-[96%] z-10">
                <svg viewBox="0 0 100 100" preserveAspectRatio="none" class="w-full h-full drop-shadow-2xl">
                    <polygon points="20,28 -20,100 80,100" fill="#3cb371" opacity="0.6"/>
                    <polygon points="65,3 5,100 125,100" fill="#2e8b57"/>
                    <polygon points="65,3 51,20 60,15 72,22 79,14" fill="#f8fafc"/>
                    <polyline points="15,88 30,60 48,32 65,3" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="0.9" stroke-dasharray="2,2"/>
                    <text x="63" y="3" font-size="8">🚩</text>
                </svg>
            </div>

            <!-- 登山角色 -->
            <div id="climber" class="absolute z-20 transition-all duration-700 ease-in-out idle-bounce"
                 style="bottom: 8%; left: 15%; transform: translateX(-50%);">
                <div class="relative">
                    <div id="climber-avatar" class="w-14 h-18 md:w-20 md:h-24"></div>
                </div>
            </div>
            
            <div class="absolute bottom-0 left-0 w-full h-3 bg-slate-200 z-30">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-amber-400 to-emerald-500 transition-all duration-500 ease-out w-0"></div>
            </div>
        </div>

        <!-- 右側：題目與答題卡 -->
        <main class="flex-grow bg-white flex flex-col items-center justify-between p-4 md:p-6 overflow-y-auto">
            
            <div class="w-full max-w-xl flex flex-col items-center my-auto">
                <div id="question-card" class="w-full bg-indigo-50/80 border-4 border-indigo-200 rounded-3xl p-6 md:p-8 text-center shadow-inner relative mb-4">
                    
                    <div class="flex justify-between items-center mb-2">
                        <p id="level-title-display" class="text-sm md:text-base font-black text-indigo-500">第一關：2的乘數</p>
                        <div class="text-indigo-600 font-black text-sm md:text-base bg-white px-3 py-1 rounded-full border-2 border-indigo-200 shadow-sm">
                            ☕ 不計時模式
                        </div>
                    </div>

                    <div id="math-formula-box" class="flex flex-wrap items-center justify-center gap-3 md:gap-4 text-4xl md:text-6xl font-black text-slate-800 tracking-wider my-2"></div>

                    <div class="h-6 mt-3 flex items-center justify-center">
                        <p id="feedback-message" class="text-sm md:text-base font-black transition-opacity opacity-0"></p>
                    </div>
                </div>

                <div class="w-full grid grid-cols-5 gap-2 mb-4">
                    <button onclick="appendNum('1')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">1</button>
                    <button onclick="appendNum('2')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">2</button>
                    <button onclick="appendNum('3')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">3</button>
                    <button onclick="appendNum('4')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">4</button>
                    <button onclick="appendNum('5')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">5</button>
                    <button onclick="appendNum('6')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">6</button>
                    <button onclick="appendNum('7')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">7</button>
                    <button onclick="appendNum('8')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">8</button>
                    <button onclick="appendNum('9')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">9</button>
                    <button onclick="appendNum('0')" class="py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-black rounded-xl text-xl shadow-sm border-b-2 border-slate-300">0</button>
                </div>

                <div class="w-full flex gap-3">
                    <button onclick="clearAnswer()" class="w-1/3 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl text-lg border-b-4 border-slate-300 transition-all active:scale-95">
                        重設
                    </button>
                    <button id="btn-submit" onclick="checkAnswer()" class="w-2/3 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-2xl text-xl shadow-md border-b-4 border-emerald-700 transition-all active:scale-95">
                        確定！ (Enter)
                    </button>
                </div>
            </div>

        </main>
    </div>

    <!-- 過關彈出報告視窗 (Modal) -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex justify-center items-center p-4">
        <div id="modal-content" class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-2xl max-w-lg w-full text-center transform transition-transform scale-90 border-4 border-indigo-200 max-h-[95vh] overflow-y-auto">
            <div class="text-6xl mb-2" id="modal-icon">🏆</div>
            <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-1" id="modal-title">順利登頂！</h2>
            
            <!-- 清楚顯示：第幾關及其對應的乘數內容 -->
            <p class="text-indigo-600 font-black text-base md:text-lg mb-4" id="modal-subtitle">第一關：2的乘數</p>
            
            <div class="bg-sky-50 rounded-2xl p-3 md:p-4 mb-4 grid grid-cols-2 gap-3 border border-sky-100">
                <div class="bg-white p-3 rounded-xl border border-emerald-200 shadow-sm">
                    <p class="text-xs text-slate-500 font-bold">🌟 首對數量</p>
                    <p class="text-3xl font-black text-emerald-600 mt-1" id="modal-first-correct">0</p>
                </div>
                <div class="bg-white p-3 rounded-xl border border-rose-200 shadow-sm">
                    <p class="text-xs text-slate-500 font-bold">⚠️ 未首對數量</p>
                    <p class="text-3xl font-black text-rose-500 mt-1" id="modal-not-first">0</p>
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="flex flex-col gap-2.5">
                <!-- 1. 進入下一關按鈕 -->
                <button id="modal-btn-next" onclick="modalNextAction()" class="w-full py-3 bg-amber-400 hover:bg-amber-500 text-amber-950 font-black rounded-2xl text-lg transition-all active:scale-95 shadow-md border-b-4 border-amber-600">
                    進入下一關 ➔
                </button>

                <!-- 2. 重玩這關按鈕 -->
                <button onclick="restartCurrentLevel()" class="w-full py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-2xl text-sm transition-all border border-indigo-200 active:scale-95">
                    🔄 重玩這關
                </button>

                <!-- 3. 快捷關卡選擇區 (1-9關) -->
                <div class="mt-2 pt-3 border-t border-slate-200">
                    <p class="text-xs font-bold text-slate-500 mb-2">🎯 自由選擇任意關卡：</p>
                    <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5">
                        <button onclick="jumpToLevelFromModal(1)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第1關</span>
                            <span class="text-[10px] font-normal opacity-80">2的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(2)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第2關</span>
                            <span class="text-[10px] font-normal opacity-80">3的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(3)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第3關</span>
                            <span class="text-[10px] font-normal opacity-80">4的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(4)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第4關</span>
                            <span class="text-[10px] font-normal opacity-80">5的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(5)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第5關</span>
                            <span class="text-[10px] font-normal opacity-80">6的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(6)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第6關</span>
                            <span class="text-[10px] font-normal opacity-80">7的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(7)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第7關</span>
                            <span class="text-[10px] font-normal opacity-80">8的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(8)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center">
                            <span class="text-xs">第8關</span>
                            <span class="text-[10px] font-normal opacity-80">9的乘數</span>
                        </button>
                        <button onclick="jumpToLevelFromModal(9)" class="py-1.5 px-1 bg-slate-100 hover:bg-indigo-500 hover:text-white text-slate-700 font-black rounded-xl transition-all border border-slate-200 shadow-sm active:scale-95 flex flex-col items-center col-span-3 sm:col-span-1">
                            <span class="text-xs">第9關</span>
                            <span class="text-[10px] font-normal opacity-80">2-9綜合</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 遊戲邏輯與腳本 -->
    <script>
        const playerConfig = { gender: 'boy', hair: 1, color: '#3b82f6' };
        let currentExpression = 'normal';
        let setupSelectedMode = 'single'; // 'single' 或 'all'

        // 關卡配置：1-9關設定 (第1-8關：15題首對，第9關：20題首對)
        const LEVEL_CONFIG = {
            1: { title: "第一關：2的乘數", multiplierText: "2的乘數", minA: 2, maxA: 2, target: 15 },
            2: { title: "第二關：3的乘數", multiplierText: "3的乘數", minA: 3, maxA: 3, target: 15 },
            3: { title: "第三關：4的乘數", multiplierText: "4的乘數", minA: 4, maxA: 4, target: 15 },
            4: { title: "第四關：5的乘數", multiplierText: "5的乘數", minA: 5, maxA: 5, target: 15 },
            5: { title: "第五關：6的乘數", multiplierText: "6的乘數", minA: 6, maxA: 6, target: 15 },
            6: { title: "第六關：7的乘數", multiplierText: "7的乘數", minA: 7, maxA: 7, target: 15 },
            7: { title: "第七關：8的乘數", multiplierText: "8的乘數", minA: 8, maxA: 8, target: 15 },
            8: { title: "第八關：9的乘數", multiplierText: "9的乘數", minA: 9, maxA: 9, target: 15 },
            9: { title: "第九關：2至9綜合大挑戰", multiplierText: "2至9綜合大挑戰", minA: 2, maxA: 9, target: 20 }
        };

        let currentLevel = 1;
        let targetGoal = 15;
        let isAllChallenge = false;
        
        let firstTryCorrectCount = 0;
        let notFirstTryCount = 0;

        let isCurrentFirstAttempt = true;
        let isGameActive = true;
        
        // 題目紀錄與歷史隊列
        let recentQuestions = [];
        let currentQuestion = null;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {}
        }

        function getClimberSVG(config, expression = 'normal') {
            const c = config.color;
            const hairColor = config.gender === 'boy' ? '#3d2612' : '#2b170c';
            let face = '';
            
            const blush = `<circle cx="36" cy="41" r="3.5" fill="#ff7676" opacity="0.4"/>
                           <circle cx="64" cy="41" r="3.5" fill="#ff7676" opacity="0.4"/>`;

            if (expression === 'normal') {
                face = `${blush}
                        <circle cx="41" cy="36" r="2.8" fill="#222"/>
                        <circle cx="59" cy="36" r="2.8" fill="#222"/>
                        <circle cx="42.2" cy="34.8" r="1" fill="#fff"/>
                        <circle cx="60.2" cy="34.8" r="1" fill="#fff"/>
                        <path d="M 44 44 Q 50 49 56 44" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
            } else if (expression === 'sad') {
                face = `${blush}
                        <circle cx="41" cy="36" r="2.8" fill="#222"/>
                        <circle cx="59" cy="36" r="2.8" fill="#222"/>
                        <path d="M 38 31 Q 42 33 44 32" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M 62 31 Q 58 33 56 32" stroke="#222" stroke-width="2" fill="none" stroke-linecap="round"/>
                        <path d="M 44 47 Q 50 42 56 47" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
            } else if (expression === 'happy' || expression === 'crown') {
                face = `${blush}
                        <path d="M 38 36 Q 41 31 44 36" stroke="#222" stroke-width="2.8" fill="none" stroke-linecap="round"/>
                        <path d="M 56 36 Q 59 31 62 36" stroke="#222" stroke-width="2.8" fill="none" stroke-linecap="round"/>
                        <path d="M 43 43 Q 50 51 57 43 Z" fill="#e11d48"/>
                        <path d="M 45 44 Q 50 47 55 44" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
            }

            let hairFront = '';
            let hairBack = '';
            let accessories = '';

            if (config.gender === 'boy') {
                if (config.hair === 1) {
                    hairFront = `<path d="M 27 33 C 26 18 34 10 50 10 C 66 10 74 18 73 33 C 70 30 67 36 62 28 C 57 33 53 27 50 30 C 47 27 43 33 38 28 C 33 36 30 30 27 33 Z" fill="${hairColor}"/>`;
                } else {
                    hairFront = `<path d="M 27 35 C 26 17 34 9 50 9 C 66 9 74 17 73 35 C 70 29 65 24 53 29 C 50 25 47 25 44 29 C 35 24 30 29 27 35 Z" fill="${hairColor}"/>`;
                }
            } else {
                if (config.hair === 1) {
                    hairBack = `<path d="M 30 28 C 12 18 2 38 8 62 C 11 74 21 70 23 57 Z" fill="${hairColor}"/>
                                <path d="M 70 28 C 88 18 98 38 92 62 C 89 74 79 70 77 57 Z" fill="${hairColor}"/>`;
                    accessories = `<circle cx="28" cy="29" r="4.5" fill="${c}" /><circle cx="72" cy="29" r="4.5" fill="${c}" />`;
                    hairFront = `<path d="M 27 36 C 26 16 34 9 50 9 C 66 9 74 16 73 36 C 70 30 64 27 50 29 C 36 27 30 30 27 36 Z" fill="${hairColor}"/>`;
                } else {
                    hairBack = `<path d="M 27 30 C 20 45 16 68 20 88 C 24 93 33 91 32 78 Z" fill="${hairColor}"/>
                                <path d="M 73 30 C 80 45 84 68 80 88 C 76 93 67 91 68 78 Z" fill="${hairColor}"/>`;
                    accessories = `<circle cx="50" cy="14" r="3.5" fill="#f43f5e" />`;
                    hairFront = `<path d="M 27 36 C 26 16 34 9 50 9 C 66 9 74 16 73 36 Z" fill="${hairColor}"/>`;
                }
            }

            let crown = expression === 'crown' ? `<polygon points="35,12 40,22 50,3 60,22 65,12 62,29 38,29" fill="#fbbf24" stroke="#d97706" stroke-width="1.8"/>` : '';
            let body = config.gender === 'girl' ? `<path d="M 34 55 L 66 55 L 76 92 L 24 92 Z" fill="${c}"/>` : `<rect x="30" y="55" width="40" height="35" rx="8" fill="${c}"/>`;

            return `
            <svg viewBox="0 0 100 120" class="w-full h-full drop-shadow-md">
                ${hairBack}
                <rect x="37" y="85" width="9" height="24" fill="#334155" rx="4"/>
                <rect x="54" y="85" width="9" height="24" fill="#334155" rx="4"/>
                <ellipse cx="41.5" cy="107" rx="6" ry="3.5" fill="#0f172a"/>
                <ellipse cx="58.5" cy="107" rx="6" ry="3.5" fill="#0f172a"/>
                ${body}
                <circle cx="50" cy="35" r="21" fill="#ffdfc4" />
                ${hairFront}
                ${accessories}
                ${face}
                ${crown}
            </svg>`;
        }

        function updateSetupUI() {
            const btnBoy = document.getElementById('btn-gender-boy');
            const btnGirl = document.getElementById('btn-gender-girl');
            const btnHair1 = document.getElementById('btn-hair-1');
            const btnHair2 = document.getElementById('btn-hair-2');

            if (playerConfig.gender === 'boy') {
                btnBoy.className = "flex-1 py-2 border-4 border-sky-400 bg-sky-100 text-sky-800 font-black rounded-xl active:scale-95 transition-all text-sm shadow-sm";
                btnGirl.className = "flex-1 py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl active:scale-95 transition-all text-sm";
            } else {
                btnGirl.className = "flex-1 py-2 border-4 border-pink-400 bg-pink-100 text-pink-800 font-black rounded-xl active:scale-95 transition-all text-sm shadow-sm";
                btnBoy.className = "flex-1 py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl active:scale-95 transition-all text-sm";
            }

            if (playerConfig.hair === 1) {
                btnHair1.className = "flex-1 py-2 border-4 border-amber-400 bg-amber-100 text-amber-800 font-black rounded-xl active:scale-95 transition-all text-sm shadow-sm";
                btnHair2.className = "flex-1 py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl active:scale-95 transition-all text-sm";
            } else {
                btnHair2.className = "flex-1 py-2 border-4 border-amber-400 bg-amber-100 text-amber-800 font-black rounded-xl active:scale-95 transition-all text-sm shadow-sm";
                btnHair1.className = "flex-1 py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl active:scale-95 transition-all text-sm";
            }

            document.getElementById('setup-preview').innerHTML = getClimberSVG(playerConfig, 'normal');
            document.getElementById('climber-avatar').innerHTML = getClimberSVG(playerConfig, currentExpression);
        }

        function setPlayerOption(key, value) {
            playerConfig[key] = value;
            updateSetupUI();
        }

        function setSetupGameMode(mode) {
            setupSelectedMode = mode;
            const btnSingle = document.getElementById('btn-setup-mode-single');
            const btnAll = document.getElementById('btn-setup-mode-all');
            const levelContainer = document.getElementById('setup-level-select-container');

            if (mode === 'single') {
                btnSingle.className = "py-2 border-4 border-indigo-400 bg-indigo-100 text-indigo-900 font-black rounded-xl text-xs md:text-sm active:scale-95 transition-all shadow-sm";
                btnAll.className = "py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl text-xs md:text-sm active:scale-95 transition-all";
                levelContainer.style.display = 'block';
            } else {
                btnAll.className = "py-2 border-4 border-amber-400 bg-amber-100 text-amber-900 font-black rounded-xl text-xs md:text-sm active:scale-95 transition-all shadow-sm";
                btnSingle.className = "py-2 border-4 border-slate-200 bg-slate-50 text-slate-500 font-bold rounded-xl text-xs md:text-sm active:scale-95 transition-all";
                levelContainer.style.display = 'none';
            }
        }

        function finishSetup() {
            const setupScreen = document.getElementById('setup-screen');
            setupScreen.classList.add('opacity-0');
            setTimeout(() => {
                setupScreen.classList.add('hidden');
                
                if (setupSelectedMode === 'all') {
                    startLevel(1, true);
                } else {
                    const chosenLevel = parseInt(document.getElementById('setup-level-select').value);
                    startLevel(chosenLevel, false);
                }
            }, 500);
        }

        function userSelectLevel(lvl) {
            startLevel(parseInt(lvl), false);
        }

        function startAllChallenge() {
            startLevel(1, true);
        }

        function startLevel(lvl, allMode = false) {
            currentLevel = lvl;
            isAllChallenge = allMode;
            targetGoal = LEVEL_CONFIG[currentLevel].target;

            firstTryCorrectCount = 0;
            notFirstTryCount = 0;
            recentQuestions = [];

            const uiClimber = document.getElementById('climber');
            uiClimber.classList.remove('victory-animation');
            uiClimber.classList.add('idle-bounce');

            document.getElementById('level-select').value = currentLevel;
            document.getElementById('level-title-display').innerText = LEVEL_CONFIG[currentLevel].title;

            const modeLabel = document.getElementById('ui-mode-label');
            if (isAllChallenge) {
                modeLabel.innerText = `🏆 全關挑戰 (第 ${currentLevel}/9 關)`;
                modeLabel.className = "text-xs font-black text-amber-600";
            } else {
                modeLabel.innerText = "🎯 單關練習";
                modeLabel.className = "text-xs font-black text-indigo-600";
            }

            updateExpression('normal');
            updateStatsUI();

            isGameActive = true;
            generateNextQuestion();
        }

        // 隨機選題：符合相隔最少 5 題才再出現的規則
        function getRandomPair(cfg) {
            const allPairs = [];
            for (let a = cfg.minA; a <= cfg.maxA; a++) {
                for (let b = 2; b <= 9; b++) {
                    allPairs.push({ num1: a, num2: b, key: `${a}x${b}` });
                }
            }

            // 過濾掉最近 5 題內出現過的題目
            let validPairs = allPairs.filter(p => !recentQuestions.includes(p.key));

            // 防護機制：萬一合適題目不足，則降低為允許最近出現過的最舊題目
            if (validPairs.length === 0) {
                validPairs = allPairs;
            }

            const chosen = validPairs[Math.floor(Math.random() * validPairs.length)];
            
            // 將題目紀錄至歷史隊列，確保相隔最少5題
            recentQuestions.push(chosen.key);
            if (recentQuestions.length > 5) {
                recentQuestions.shift(); // 維持最新 5 題歷史
            }

            return chosen;
        }

        function generateNextQuestion() {
            const cfg = LEVEL_CONFIG[currentLevel];
            const pair = getRandomPair(cfg);

            isCurrentFirstAttempt = true;
            clearAnswer();
            hideFeedback();

            const n1 = pair.num1;
            const n2 = pair.num2;
            currentQuestion = { num1: n1, num2: n2, correctAnswer: n1 * n2 };

            const formulaBox = document.getElementById('math-formula-box');
            formulaBox.innerHTML = `
                <span>${n1}</span>
                <span class="text-indigo-600">✕</span>
                <span>${n2}</span>
                <span class="text-slate-400">=</span>
                <input type="number" id="answer-input" placeholder="?" autocomplete="off"
                    class="w-24 h-16 md:w-32 md:h-20 text-center text-3xl md:text-5xl font-black text-indigo-700 bg-white border-4 border-indigo-400 rounded-2xl shadow-md focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-200 transition-all">
            `;

            const ansInput = document.getElementById('answer-input');
            ansInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') checkAnswer();
            });

            setTimeout(() => ansInput.focus(), 50);
        }

        function checkAnswer() {
            if (!isGameActive) return;

            const inputEl = document.getElementById('answer-input');
            const val = parseInt(inputEl.value.trim());

            if (isNaN(val)) {
                showFeedback("請先輸入數字答案！", "text-amber-500");
                inputEl.focus();
                return;
            }

            if (val === currentQuestion.correctAnswer) {
                playSound('correct');

                if (isCurrentFirstAttempt) {
                    firstTryCorrectCount++;
                    showFeedback("🎉 答對了！首對攀登前進！", "text-emerald-500");
                } else {
                    showFeedback("👍 修正正確！繼續加油！", "text-emerald-500");
                }

                updateExpression('happy');
                updateStatsUI();

                if (firstTryCorrectCount >= targetGoal) {
                    isGameActive = false;
                    updateExpression('crown');

                    const uiClimber = document.getElementById('climber');
                    uiClimber.classList.remove('idle-bounce');
                    uiClimber.classList.add('victory-animation');

                    setTimeout(() => {
                        showLevelCompleteModal();
                    }, 1800);
                } else {
                    setTimeout(() => {
                        updateExpression('normal');
                        generateNextQuestion();
                    }, 400);
                }

            } else {
                playSound('wrong');

                if (isCurrentFirstAttempt) {
                    notFirstTryCount++;
                    isCurrentFirstAttempt = false;
                }

                showFeedback("❌ 答錯了！請再算一次，答對才能繼續下一題喔！", "text-rose-500");
                updateExpression('sad');
                updateStatsUI();

                const qCard = document.getElementById('question-card');
                qCard.classList.remove('shake-animation');
                void qCard.offsetWidth;
                qCard.classList.add('shake-animation');

                inputEl.value = '';
                inputEl.focus();

                setTimeout(() => {
                    updateExpression('normal');
                }, 800);
            }
        }

        function appendNum(num) {
            if (!isGameActive) return;
            const inputEl = document.getElementById('answer-input');
            if (inputEl) {
                if (inputEl.value.length < 3) inputEl.value += num;
                inputEl.focus();
            }
        }

        function clearAnswer() {
            const inputEl = document.getElementById('answer-input');
            if (inputEl) {
                inputEl.value = '';
                inputEl.focus();
            }
        }

        function showFeedback(msg, colorClass) {
            const fb = document.getElementById('feedback-message');
            fb.innerText = msg;
            fb.className = `text-sm md:text-base font-black transition-opacity duration-200 ${colorClass} opacity-100`;
        }

        function hideFeedback() {
            const fb = document.getElementById('feedback-message');
            fb.className = "text-sm md:text-base font-black transition-opacity opacity-0";
        }

        function updateExpression(exp) {
            currentExpression = exp;
            document.getElementById('climber-avatar').innerHTML = getClimberSVG(playerConfig, currentExpression);
        }

        function updateStatsUI() {
            document.getElementById('stat-first-correct').innerText = firstTryCorrectCount;
            document.getElementById('stat-target-goal').innerText = targetGoal;
            document.getElementById('stat-not-first').innerText = notFirstTryCount;

            const progressPercent = Math.min(100, Math.round((firstTryCorrectCount / targetGoal) * 100));
            document.getElementById('ui-progress-text').innerText = `${progressPercent}%`;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const startX = 15; const endX = 65;
            const startY = 8;  const endY = 91;

            const currentX = startX + ((endX - startX) * (progressPercent / 100));
            const currentY = startY + ((endY - startY) * (progressPercent / 100));

            const uiClimber = document.getElementById('climber');
            uiClimber.style.left = `${currentX}%`;
            uiClimber.style.bottom = `${currentY}%`;
        }

        function showLevelCompleteModal() {
            const modal = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');

            document.getElementById('modal-title').innerText = `第 ${currentLevel} 關 順利登頂！`;
            document.getElementById('modal-subtitle').innerText = LEVEL_CONFIG[currentLevel].title;
            
            document.getElementById('modal-first-correct').innerText = firstTryCorrectCount;
            document.getElementById('modal-not-first').innerText = notFirstTryCount;

            const nextBtn = document.getElementById('modal-btn-next');

            if (isAllChallenge) {
                if (currentLevel < 9) {
                    document.getElementById('modal-icon').innerText = "🚀";
                    nextBtn.innerText = `前往第 ${currentLevel + 1} 關 ➔`;
                } else {
                    document.getElementById('modal-icon').innerText = "👑";
                    document.getElementById('modal-title').innerText = "全 9 關卡大挑戰通關！";
                    nextBtn.innerText = "再玩一次全關挑戰";
                }
            } else {
                document.getElementById('modal-icon').innerText = "🏆";
                if (currentLevel < 9) {
                    nextBtn.innerText = "進入下一關 ➔";
                } else {
                    nextBtn.innerText = "返回第一關";
                }
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-90');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function modalNextAction() {
            closeModal();
            if (isAllChallenge) {
                if (currentLevel < 9) {
                    startLevel(currentLevel + 1, true);
                } else {
                    startAllChallenge();
                }
            } else {
                if (currentLevel < 9) {
                    startLevel(currentLevel + 1, false);
                } else {
                    startLevel(1, false);
                }
            }
        }

        function restartCurrentLevel() {
            closeModal();
            startLevel(currentLevel, isAllChallenge);
        }

        function jumpToLevelFromModal(lvl) {
            closeModal();
            startLevel(lvl, false);
        }

        function closeModal() {
            const modal = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }

        window.onload = () => {
            updateSetupUI();
            setSetupGameMode('single');
        };
    </script>
</body>
</html>
